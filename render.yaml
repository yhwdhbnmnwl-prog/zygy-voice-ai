services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1/1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1/1\",\"m\":\"2\",\"g\":\"שלום אני דני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"אתה שנון שואל חידות מספר בדיחות אומר פתגמים\"},{\"p\":\"1/2\",\"m\":\"1\",\"g\":\"שלום אני דני שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"\"},{\"p\":\"1/3\",\"m\":\"2\",\"g\":\"שלום אני הראש ישיבה שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"אתה ראש ישיבת משכנות התורה בבני ברק ויש לך ישיבה עם 450 בחורים קוראים לך אפרים כהן\"}]"
      - key: MAX_WORDS
        value: "80"
      - key: EXTRA_INSTRUCTION
        value: "למי שפיתח אותך קוראים יהודה"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
